plugins {
 id 'fabric-loom' version '1.8.13'
 id 'maven-publish'
}
version = '0.1.0-preview.2'
group = 'jp.arils.belowzero'
base { archivesName = 'yspan-client' }
repositories { mavenCentral() }
dependencies {
 minecraft 'com.mojang:minecraft:1.16.5'
 mappings loom.officialMojangMappings()
 modImplementation 'net.fabricmc:fabric-loader:0.16.14'
}
loom {
 runs {
  client {
   client()
   runDir 'run'
   vmArg '-Xmx1536M'
   if (project.hasProperty('belowzeroProbe')) {
    vmArg '-Dbelowzero.probe=true'
    programArgs '--server', '127.0.0.1', '--port', '25576', '--username', 'BZProbe', '--width', '960', '--height', '640'
   }
  }
 }
}
tasks.withType(JavaCompile).configureEach { options.release = 8 }
java { sourceCompatibility = JavaVersion.VERSION_1_8; targetCompatibility = JavaVersion.VERSION_1_8; withSourcesJar() }

if (project.hasProperty("belowzeroControl")) { loom.runs.client.vmArg "-Dbelowzero.disabled=true" }

// Connection lifecycle regression checks, without starting Minecraft.
tasks.register('negotiationCheck', JavaExec) {
 dependsOn testClasses
 classpath = sourceSets.test.runtimeClasspath
 mainClass = 'jp.arils.belowzero.NegotiationCheck'
}
tasks.named('check') { dependsOn 'negotiationCheck' }
